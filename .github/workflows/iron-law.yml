name: iron-law
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gate-self-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/tests/test_iron_law.py
  end-to-end:
    # Required check. Never mark optional or continue-on-error.
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      POLYML_VERSION: 5.9.1
      HOL4_COMMIT: 9783a49979c94c401ff8c0e51b2eefae7ea95ae3
      CAKEML_COMMIT: cd9155694c16831373ab695a670794f23282ed62
      TOOLCHAIN_ROOT: /home/runner/forge-toolchain
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space for HOL4 + CakeML build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
      - name: Install build dependencies, AArch64 binutils, and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential ca-certificates git \
            libffi-dev libgmp-dev libtool pkg-config \
            binutils-aarch64-linux-gnu qemu-user-static
      - name: Cache pinned upstream Poly/ML + HOL4 + CakeML toolchain (zero forge-iron theories)
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_ROOT }}
          key: poly${{ env.POLYML_VERSION }}-hol4-${{ env.HOL4_COMMIT }}-cakeml-${{ env.CAKEML_COMMIT }}-u2404-v2
      - name: Build pinned upstream Poly/ML 5.9.1 + HOL4 + CakeML on cache miss
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$TOOLCHAIN_ROOT"
          # 1. Build upstream Poly/ML 5.9.1 into $TOOLCHAIN_ROOT/polyml
          git clone --depth 1 --branch "v${POLYML_VERSION}" \
            https://github.com/polyml/polyml.git /tmp/polyml-src
          (
            cd /tmp/polyml-src
            ./configure --prefix="$TOOLCHAIN_ROOT/polyml" --enable-shared
            make -j 2
            make install
          )
          rm -rf /tmp/polyml-src
          export PATH="$TOOLCHAIN_ROOT/polyml/bin:$PATH"
          export LD_LIBRARY_PATH="$TOOLCHAIN_ROOT/polyml/lib:${LD_LIBRARY_PATH:-}"
          poly -v
          # 2. Build upstream HOL4 (stdknl)
          git clone https://github.com/HOL-Theorem-Prover/HOL.git "$TOOLCHAIN_ROOT/HOL"
          git -C "$TOOLCHAIN_ROOT/HOL" checkout "$HOL4_COMMIT"
          (cd "$TOOLCHAIN_ROOT/HOL" && poly < tools/smart-configure.sml && bin/build -j 2)
          export PATH="$TOOLCHAIN_ROOT/HOL/bin:$PATH"
          (cd "$TOOLCHAIN_ROOT/HOL/examples/l3-machine-code/arm8/step" && Holmake -j 1)
          # 3. Build upstream CakeML ARM8 proofs, heap, and eval_cake_compile_arm8Lib
          git clone https://github.com/CakeML/cakeml.git "$TOOLCHAIN_ROOT/cakeml"
          git -C "$TOOLCHAIN_ROOT/cakeml" checkout "$CAKEML_COMMIT"
          (cd "$TOOLCHAIN_ROOT/cakeml/cv_translator" && Holmake -j 1 cake_compile_heap)
          (cd "$TOOLCHAIN_ROOT/cakeml/basis" && Holmake -j 1 Word8ArrayProofTheory.uo)
          (cd "$TOOLCHAIN_ROOT/cakeml/compiler/backend/arm8/proofs" && Holmake -j 1)
          (cd "$TOOLCHAIN_ROOT/cakeml/compiler/backend/arm8" && Holmake -j 1 eval_cake_compile_arm8Lib.uo)
          rm -rf "$TOOLCHAIN_ROOT/HOL/.git" "$TOOLCHAIN_ROOT/cakeml/.git"
      - name: Clean all forge_* theories and run Iron Law gate
        env:
          CAKEMLDIR: /home/runner/forge-toolchain/cakeml
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_ROOT/HOL/bin:$TOOLCHAIN_ROOT/polyml/bin:$PATH"
          export LD_LIBRARY_PATH="$TOOLCHAIN_ROOT/polyml/lib:${LD_LIBRARY_PATH:-}"
          (cd kernel/hol4 && Holmake cleanAll)
          python3 scripts/iron_law.py
      - name: Run real HOL4 kernel Term.aconv negative controls
        env:
          CAKEMLDIR: /home/runner/forge-toolchain/cakeml
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_ROOT/HOL/bin:$TOOLCHAIN_ROOT/polyml/bin:$PATH"
          export LD_LIBRARY_PATH="$TOOLCHAIN_ROOT/polyml/lib:${LD_LIBRARY_PATH:-}"
          python3 scripts/tests/test_hol_audit_real.py
      - name: Run ARM64 black-box smoke suite under QEMU
        run: python3 scripts/smoke_m1.py --qemu qemu-aarch64-static kernel/build/forge-kernel
